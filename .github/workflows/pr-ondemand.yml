name: Trigger OnDemand via PR
on:
  issue_comment:
    types:
      - created

jobs:
  process-comment:
    runs-on: ubuntu-latest
    if: startsWith(github.event.comment.body, '/deploy') || startsWith(github.event.comment.body, '/terminate')
    outputs:
      head_ref: ${{ steps.get-head-ref.outputs.head_ref }}
      ondemand_env: ${{ steps.env-name.outputs.ondemand_env }}
      action: ${{ steps.env-name.outputs.action }}
    steps:
      - name: Get branch head ref
        id: get-head-ref
        run: |
          PR_INFO="${{ github.event.issue.pull_request }}"
          if [[ -n "$PR_INFO" ]]; then
            echo "head_ref=$(gh pr view ${{ github.event.issue.number }} --repo ${{ github.repository }} --json headRefName | jq -r '.headRefName')" >> "$GITHUB_OUTPUT"
          else
            echo "head_ref=$(echo ${{ github.ref }} | sed 's/refs\/heads\///')" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get environment name
        if: startsWith(github.event.comment.body, '/deploy') || startsWith(github.event.comment.body, '/terminate')
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6.4.1
        id: env-name
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const envRegex = /env:\s*([a-zA-Z0-9-]+)/;
            const labels = context.payload.issue.labels.map(label => label.name);
            const match = labels.find(label => envRegex.test(label));
            let action = '';

            if (context.payload.comment.body.startsWith('/deploy')) {
              action = 'deploy';
            } else if (context.payload.comment.body.startsWith('/terminate')) {
              action = 'terminate';
            }

            if (match) {
              const envName = match.match(envRegex)[1];
              const protectedEnvs = ["hotfix", "qa", "develop", "dev", "preprod", "alpha", "aqa"];
              if (!protectedEnvs.includes(envName)) {
                core.setOutput('ondemand_env', envName);
                core.setOutput('action', action);
              } else {
                core.setFailed(`Invalid ondemand_env "${envName}". Aborting the pipeline...`);
              }
            } else {
              core.setFailed('No label env found on the issue. Aborting the pipeline...');
            }

  trigger-ondemand:
    runs-on: ubuntu-latest
    needs: process-comment
    if: ${{ needs.process-comment.outputs.ondemand_env && needs.process-comment.outputs.action }}
    steps:
      - name: Trigger On-Demand Workflow
        run: |
          gh workflow run ci-cd-ondemand.yaml \
            -f ondemand_env=${{ needs.process-comment.outputs.ondemand_env }} \
            -f action=${{ needs.process-comment.outputs.action }} \
            --ref ${{ needs.process-comment.outputs.head_ref }} \
            --repo telus-health-ch/fhirrtg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
